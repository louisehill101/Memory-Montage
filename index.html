<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Journal</title>
<style>
@import url('https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap');
* {{ margin: 0; padding: 0; box-sizing: border-box; }}
html, body {{
  background: #ffffff;
  color: #1a1a1a;
  font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh;
}}
.page {{
  max-width: 480px;
  margin: 0 auto;
  padding: 4rem 1.75rem 4rem;
}}
.masthead {{
  font-size: 0.75rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #999;
  margin-bottom: 2.5rem;
}}
h1 {{
  font-size: 1.4rem;
  font-weight: 700;
  margin-bottom: 2.5rem;
}}
ul {{ list-style: none; }}
li {{ border-top: 1px solid #eee; }}
li:last-child {{ border-bottom: 1px solid #eee; }}
a {{
  display: block;
  padding: 1rem 0;
  color: #1a1a1a;
  text-decoration: none;
  font-size: 1.05rem;
  font-weight: 500;
}}
a:hover {{ color: #666; }}
</style>
</head>

<div class="page">
  <div class="masthead">Travel Journal</div>
