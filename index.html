<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Journal</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400,500&family=Inter:wght@400;500;600&display=swap');
* {{ margin: 0; padding: 0; box-sizing: border-box; }}
html, body {{
  background: #f3efe4;
  color: #262019;
  font-family: 'Cormorant Garamond', Georgia, serif;
  min-height: 100vh;
}}
.page {{
  max-width: 640px;
  margin: 0 auto;
  padding: 5rem 2rem 4rem;
}}
.masthead {{
  font-family: 'Inter', sans-serif;
  font-size: 0.72rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 3.5rem;
}}
h1 {{
  font-style: italic;
  font-size: 1.8rem;
  font-weight: 400;
  margin-bottom: 3rem;
}}
ul {{ list-style: none; }}
li {{
  border-top: 1px solid #ddd4c0;
  padding: 1.1rem 0;
}}
li:last-child {{ border-bottom: 1px solid #ddd4c0; }}
a {{
  color: #262019;
  text-decoration: none;
  font-size: 1.15rem;
  font-style: italic;
  display: block;
}}
a:hover {{ color: #7a7061; }}
</style>
</head>
<body>
<div class="page">
  <div class="masthead">Travel Journal</div>
  <h1>a few entries, a few places</h1>

    <li><a href="kyoto.html">Kyoto</a></li>

    <li><a href="yokohama.html">Yokohama</a></li>

  </ul>
</div>
</body>
</html>
