  <h1>Kobe — May 2022</h1>
  <div class="poem">
        <p>I didn't like this city all that much.</p>
        <p>I remember feeling very awkward, and couldn't wait to leave.</p>
        <p>This bookstore was the only thing I liked.</p>
        <p>I couldn't speak a word of Japanese, and all the books were in Kanji.</p>
        <p>Maybe next time.</p>
  </div>
